apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: redis}
spec:
  selector: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: redis}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
