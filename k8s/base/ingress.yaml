apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kindbytes-web
spec:
  ingressClassName: nginx
  rules:
    - host: kindbytes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kindbytes-web
                port: {name: http}
  # HTTPS: install cert-manager, uncomment, and set DJANGO_SECURE_COOKIES to "1".
  # tls:
  #   - hosts: [kindbytes.example.org]
  #     secretName: kindbytes-tls
