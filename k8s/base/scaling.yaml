# Web tier scales 2-6 pods on CPU; at least one pod stays up during node maintenance.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kindbytes-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kindbytes-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kindbytes-web
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: web}
