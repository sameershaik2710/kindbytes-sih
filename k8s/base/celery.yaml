# Celery worker: runs the dispatch simulation ticks (and any future background jobs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindbytes-worker
  labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/sameershaik2710/kindbytes:1.0.0
          command: ["celery", "-A", "kindbytes", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef: {name: kindbytes-config}
            - secretRef: {name: kindbytes-secrets}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
# Celery beat: the clock. Exactly one replica, so Recreate instead of RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindbytes-beat
  labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: beat}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: beat}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kindbytes, app.kubernetes.io/component: beat}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: beat
          image: ghcr.io/sameershaik2710/kindbytes:1.0.0
          command: ["celery", "-A", "kindbytes", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: {name: kindbytes-config}
            - secretRef: {name: kindbytes-secrets}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
