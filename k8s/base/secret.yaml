# Development values only. In production create this Secret from a vault or
# sealed-secrets, and never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: kindbytes-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-with-a-long-random-string"
  POSTGRES_PASSWORD: "kindbytes-dev-password"
  DATABASE_URL: "postgres://kindbytes:kindbytes-dev-password@postgres:5432/kindbytes"
