# kind / minikube: use the image you built locally (`docker build -t kindbytes:1.0.0 .`)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/sameershaik2710/kindbytes
    newName: kindbytes
    newTag: 1.0.0
patches:
  - target: {kind: Deployment, name: kindbytes-(web|worker|beat)}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: {kind: Deployment, name: kindbytes-web}
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
